testing.value: test profile loaded
logging:
  level:
    root: DEBUG
    org.springframework.web: DEBUG
    com.example: TRACE
  file:
    name: logs/myapp.log
spring:
  datasource:
    #url: jdbc:mysql://localhost:3306/testdb --- to run application in intellij enable this line
    url: jdbc:mysql://host.docker.internal:3306/testdb  # --- to run application in docker container enable this line, this will connect from docker container to host machine for database
    username: root
    password: welcome123
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQLDialect
    database: MYSQL
    properties:
      hibernate.dialect: org.hibernate.dialect.MySQLDialect
      hibernate.format_sql: true

  rabbitmq:
    #host: localhost    --- to run application in intellij enable this line
    host: rabbitmq
    port: 5672
    username: guest
    password: guest
  kafka:
    #bootstrap-servers: localhost:9092      --- to run application in intellij enable this line
    bootstrap-servers: kafka:29092
    consumer:
      group-id: employee-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
  cache:
    type: hazelcast

management:
  endpoints:
    web:
      exposure:
        include: "*"

application:
  services:
    spring-test:
      url: http://localhost:9090